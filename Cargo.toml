[workspace]
members = [
    "crates/hitchmark-core",
    "crates/hitchmark-cli",
    "crates/hitchmark-daemon",
]
resolver = "2"

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "MIT"
authors = ["Hitchmark Contributors"]
repository = "https://github.com/elijah/hitchmark"
rust-version = "1.75"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
correctness = "deny"
