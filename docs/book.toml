[book]
title = "Hookmarks"
description = "Stable, addressable links to documents and paragraphs"
authors = ["Hitchmark Contributors"]
language = "en"
multilingual = false
src = "src"

[output.html]
default-theme = "light"
preferred-dark-theme = "navy"
smart-punctuation = true
copy-fonts = true
no-section-label = false
git-repository-url = "https://github.com/elw/hitchmark"
git-repository-icon = "fa-github"
edit-url-template = "https://github.com/elw/hitchmark/edit/master/docs/{path}"

[output.html.search]
enable = true
limit-results = 20
teaser-word-count = 30
use-boolean-and = true

[preprocessor.index]
[preprocessor.links]
