[package]
name = "hitchmark-tray"
version = "0.3.0"
edition = "2021"
license = "MIT"
authors = ["Hitchmark Contributors"]
repository = "https://github.com/elijah/hitchmark"
description = "Windows system tray applet for Hitchmark"
rust-version = "1.85"

[[bin]]
name = "hitchmark-tray"
path = "src/main.rs"

[dependencies]
hitchmark-core = { path = "../../crates/hitchmark-core" }
tray-icon = "0.19"
winit = { version = "0.30", features = ["rwh_06"] }
reqwest = { version = "0.12", features = ["blocking", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
anyhow = "1"
toml = "0.8"
open = "5"
image = "0.25"
which = "6"

[target.'cfg(windows)'.dependencies]
# Win32 API access for foreground window detection and clipboard
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Threading",
    "Win32_System_ProcessStatus",
] }
