<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hookmarks</title>
  <!-- Office JS from CDN — required for all Office Add-ins -->
  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js" type="text/javascript"></script>
  <style>
    :root {
      --color-bg: #ffffff;
      --color-surface: #f4f4f6;
      --color-border: #e0e0e4;
      --color-accent: #0078d4;
      --color-accent-hover: #005a9e;
      --color-danger: #c4314b;
      --color-text: #1b1b1f;
      --color-text-muted: #5c5c70;
      --color-success: #107c10;
      --radius: 6px;
      --font: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --color-bg: #1b1b1f;
        --color-surface: #2c2c32;
        --color-border: #3e3e46;
        --color-text: #f0f0f4;
        --color-text-muted: #9999aa;
      }
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font);
      font-size: 13px;
      color: var(--color-text);
      background: var(--color-bg);
      padding: 12px;
      line-height: 1.5;
    }

    h2 {
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    h2 svg { flex-shrink: 0; }

    .page-title {
      font-size: 12px;
      color: var(--color-text-muted);
      margin-bottom: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .uri-row {
      display: flex;
      align-items: center;
      gap: 6px;
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius);
      padding: 6px 8px;
      margin-bottom: 12px;
    }

    .uri-text {
      flex: 1;
      font-family: "SF Mono", "Cascadia Code", "Consolas", monospace;
      font-size: 11px;
      color: var(--color-text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    button {
      font-family: var(--font);
      font-size: 12px;
      border: none;
      border-radius: var(--radius);
      cursor: pointer;
      padding: 5px 10px;
      transition: background 0.15s;
    }

    .btn-primary {
      background: var(--color-accent);
      color: #fff;
    }
    .btn-primary:hover { background: var(--color-accent-hover); }

    .btn-ghost {
      background: transparent;
      color: var(--color-text-muted);
      padding: 4px 6px;
      border: 1px solid var(--color-border);
    }
    .btn-ghost:hover { background: var(--color-surface); }

    .btn-danger {
      background: transparent;
      color: var(--color-danger);
      padding: 2px 6px;
      border: 1px solid transparent;
      font-size: 11px;
    }
    .btn-danger:hover { border-color: var(--color-danger); }

    @media (prefers-reduced-motion: reduce) {
      button { transition: none; }
    }

    .section { margin-bottom: 16px; }

    .input-row {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 8px;
    }

    input[type="text"] {
      font-family: var(--font);
      font-size: 12px;
      padding: 6px 8px;
      border: 1px solid var(--color-border);
      border-radius: var(--radius);
      background: var(--color-bg);
      color: var(--color-text);
      width: 100%;
    }
    input[type="text"]:focus {
      outline: 2px solid var(--color-accent);
      outline-offset: -1px;
    }

    label { font-size: 11px; color: var(--color-text-muted); }

    #links-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 6px;
      max-height: 220px;
      overflow-y: auto;
    }

    #links-list li {
      display: flex;
      align-items: baseline;
      gap: 6px;
      padding: 6px 8px;
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius);
    }

    #links-list li.empty {
      color: var(--color-text-muted);
      font-style: italic;
      background: none;
      border: none;
    }

    .link-uri {
      flex: 1;
      font-size: 11px;
      font-family: monospace;
      color: var(--color-text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .link-note {
      font-size: 11px;
      color: var(--color-text-muted);
      font-style: italic;
      white-space: nowrap;
    }

    .status-bar {
      margin-top: 12px;
      font-size: 11px;
      color: var(--color-text-muted);
      min-height: 16px;
    }

    .divider {
      height: 1px;
      background: var(--color-border);
      margin: 12px 0;
    }

    .server-row {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 12px;
    }

    .server-row input { flex: 1; }

    details summary {
      font-size: 11px;
      color: var(--color-text-muted);
      cursor: pointer;
      user-select: none;
      margin-bottom: 8px;
    }
  </style>
</head>
<body>
  <h2>
    <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
      <path d="M6.5 9.5a3.5 3.5 0 0 0 5 0l2-2a3.535 3.535 0 0 0-5-5l-1 1"
            stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
      <path d="M9.5 6.5a3.5 3.5 0 0 0-5 0l-2 2a3.535 3.535 0 0 0 5 5l1-1"
            stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
    </svg>
    Hookmarks
  </h2>

  <!-- Current page -->
  <div class="section">
    <p class="page-title" id="page-title">Loading…</p>
    <div class="uri-row" role="group" aria-label="Current page URI">
      <span class="uri-text" id="current-uri" title="">—</span>
      <button class="btn-ghost" id="btn-copy-uri" aria-label="Copy hook:// URI" title="Copy URI">
        <svg width="12" height="12" viewBox="0 0 16 16" fill="none" aria-hidden="true">
          <rect x="5" y="5" width="9" height="9" rx="1.5" stroke="currentColor" stroke-width="1.5"/>
          <path d="M11 5V3.5A1.5 1.5 0 0 0 9.5 2H3.5A1.5 1.5 0 0 0 2 3.5v6A1.5 1.5 0 0 0 3.5 11H5"
                stroke="currentColor" stroke-width="1.5"/>
        </svg>
      </button>
      <button class="btn-ghost" id="btn-refresh" aria-label="Refresh" title="Refresh">
        <svg width="12" height="12" viewBox="0 0 16 16" fill="none" aria-hidden="true">
          <path d="M13.5 8A5.5 5.5 0 1 1 8 2.5a5.5 5.5 0 0 1 3.9 1.6L13.5 2.5V6H10"
                stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </div>
  </div>

  <!-- Existing links -->
  <div class="section">
    <h2 style="font-size:12px">Links</h2>
    <ul id="links-list" role="list" aria-label="Links for this page">
      <li class="empty">Loading…</li>
    </ul>
  </div>

  <div class="divider" role="separator"></div>

  <!-- Create new link -->
  <div class="section">
    <h2 style="font-size:12px">Add Link</h2>
    <div class="input-row">
      <label for="link-target">Target URI (hook:// or paste another page's URI)</label>
      <input type="text" id="link-target"
             placeholder="hook://file/…"
             aria-label="Target URI" />
    </div>
    <div class="input-row">
      <label for="link-note">Note (optional)</label>
      <input type="text" id="link-note"
             placeholder="Why are these linked?"
             aria-label="Link note" />
    </div>
    <button class="btn-primary" id="btn-create-link">Create Link</button>
  </div>

  <!-- Server config (collapsed) -->
  <div class="divider" role="separator"></div>
  <details>
    <summary>⚙ Server settings</summary>
    <div class="server-row">
      <input type="text" id="serverUrl"
             value="http://127.0.0.1:2701"
             placeholder="http://127.0.0.1:2701"
             aria-label="hk serve URL" />
    </div>
    <p style="font-size:11px;color:var(--color-text-muted)">
      Run <code>hk serve</code> in your terminal to enable this add-in.
    </p>
  </details>

  <p class="status-bar" id="status" role="status" aria-live="polite"></p>

  <script src="dist/taskpane.js" type="text/javascript"></script>
</body>
</html>
